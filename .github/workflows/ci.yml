name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  # The one check branch protection requires, so the matrix can change without touching settings.
  ci-passed:
    name: CI passed
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || exit 1
          done

  # Squash-merges once CI passes, then starts release.yml by hand: a merge made with
  # GITHUB_TOKEN doesn't trigger push workflows, but workflow_dispatch is exempt. Skips the
  # release PR (merging it is how a release is cut) and PRs from forks.
  merge:
    needs: ci-passed
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Squash-merge and start release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Read the title now, not from the event, in case it was edited while CI ran.
          title=$(gh pr view "$PR_URL" --json title --jq .title)
          body=$(gh pr view "$PR_URL" --json body --jq .body)
          # Same types as pr-title.yml. The title becomes the commit release-please reads.
          if ! printf '%s' "$title" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+'; then
            echo "::error::PR title is not a conventional commit: $title"
            exit 1
          fi
          # --match-head-commit refuses to merge anything newer than what CI tested.
          gh pr merge "$PR_URL" --squash --delete-branch --match-head-commit "$HEAD_SHA" \
            --subject "$title (#${{ github.event.pull_request.number }})" --body "$body"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main
