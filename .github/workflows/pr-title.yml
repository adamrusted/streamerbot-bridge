name: PR title

# PRs into dev are squash-merged, so the title becomes the commit message release-please reads.
# PRs into main are dev promotions (merge commits, so their titles never reach release-please)
# or the release PR. Separate from ci.yml so editing a title doesn't re-run the build matrix.
on:
  pull_request:
    branches: [dev]
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
