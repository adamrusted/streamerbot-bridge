name: Release

# On every push to main, release-please keeps a release PR open that bumps the version and
# CHANGELOG from conventional commits. Merging that PR creates the tag and GitHub release, and
# the build job then attaches the executables to it. ci.yml starts this by workflow_dispatch
# after its bot merges, because those merges don't fire push.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Uses GITHUB_TOKEN, so CI doesn't run on the release PR it opens. That PR only bumps the
      # version and changelog from commits that already passed CI.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}
